name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/continue-development-xp5vmg
  workflow_dispatch:
    inputs:
      debug_pdf:
        description: "Log a sample of extracted treasury-stock PDF text (for tuning parseBuybackPdfText)"
        type: boolean
        default: false
  schedule:
    # Refresh the TDnet disclosure snapshot periodically. TDnet itself has
    # no public CORS-enabled API, so the browser can't fetch it directly —
    # this is what keeps the deployed site's data from going stale.
    - cron: "*/15 * * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # push/schedule share one group so only the latest matters for keeping
  # the deployed snapshot fresh — an older in-flight run there is safe to
  # cancel. workflow_dispatch (manual debug_pdf runs) gets a group unique
  # to its own run_id instead, so a scheduled run firing mid-debug-run
  # can't cancel it (this repeatedly cancelled manual debug runs before).
  group: pages-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Fetch latest TDnet disclosures
        run: npx tsx scripts/fetch-tdnet.ts
        env:
          DEBUG_TREASURY_PDF_TEXT: ${{ inputs.debug_pdf && 'true' || 'false' }}
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
